
spring.application.name=backend

# Reject unexpected JSON fields, such as "pin".
spring.jackson.deserialization.fail-on-unknown-properties=true

# Development database
spring.datasource.url=${SAFEPAY_DB_URL}
spring.datasource.username=${SAFEPAY_DB_USERNAME}
spring.datasource.password=${SAFEPAY_DB_PASSWORD}

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Temporarily disabled until Stage 2 adds migrations.
spring.flyway.enabled=true
