spring.application.name=backend
spring.jackson.deserialization.fail-on-unknown-properties=true

# Tests must use the separate test database.
spring.datasource.url=${SAFEPAY_TEST_DB_URL}
spring.datasource.username=${SAFEPAY_DB_USERNAME}
spring.datasource.password=${SAFEPAY_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Keep disabled until Stage 2 adds migrations.
spring.flyway.enabled=true